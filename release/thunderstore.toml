# Thunderstore CLI (tcli) configuration, used by release/release.ps1 to upload the zip made by package.ps1.
[config]
schemaVersion = "0.0.1"

[package]
namespace = "DocRun"
name = "SkulInsight_QoL"
versionNumber = "0.0.0"   # overridden with --package-version
description = "Codex bestiary with boss moves and fight films, real damage in descriptions, damage source tags, boss HP numbers, a combat log that explains every hit, pickup preview. In-game settings, all 11 game languages."
websiteUrl = "https://github.com/Umut-Aslan99/SkulInsight_QoL"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_Skul = "5.4.2100"

[publish]
repository = "https://thunderstore.io"
communities = [ "skul-the-hero-slayer" ]

[publish.categories]
skul-the-hero-slayer = [ "mods" ]
