# Thunderstore CLI (tcli) configuration, used by release/release.ps1 to upload the zip made by package.ps1.
[config]
schemaVersion = "0.0.1"

[package]
namespace = "DocRun"
name = "SkulInsight_QoL"
versionNumber = "0.0.0"   # overridden with --package-version
description = "Online co-op (open beta) with Steam friends or matchmaking; Codex with boss moves and your build; run history, records, achievements; optional daily runs; real damage in descriptions, a combat log for every hit. 11 languages."
websiteUrl = "https://github.com/Umut-Aslan99/SkulInsight_QoL"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_Skul = "5.4.2100"

[publish]
repository = "https://thunderstore.io"
communities = [ "skul-the-hero-slayer" ]

[publish.categories]
skul-the-hero-slayer = [ "mods" ]
